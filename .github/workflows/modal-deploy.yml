name: Deploy Modal engine
on:
  push:
    branches: [main]
    paths:
      - engine/modal_app.py
      - engine/splicr/**
      - engine/requirements.txt
      - .github/workflows/modal-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modal-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install modal==1.6.0 pytest==8.4.2
      - name: Verify dispatch and image contracts
        run: PYTHONPATH=engine python -m pytest -q engine/tests/test_compute_gateway.py engine/tests/test_modal_image.py
      - name: Deploy engine and recovery schedules
        run: modal deploy engine/modal_app.py
      - name: Check the deployed runtime
        run: |
          python - <<'PY'
          import modal
          result = modal.Function.from_name('splicr-ingest', 'doctor').remote()
          assert result.get('healthy'), result
          print('Modal runtime healthy')
          PY
