project_id = "splicr"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://www.splicr.org"
additional_redirect_urls = ["https://splicr-web.vercel.app/auth/callback", "https://splicr.org/auth/callback", "https://www.splicr.org/auth/callback", "http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# SplicR is invitation-only. New identities are created by the trusted
# inviteUserByEmail server path, never by a public client.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
# Keep the email provider available for existing users. Public account creation
# is still blocked by auth.enable_signup, the before-user-created hook, and the
# client's shouldCreateUser: false magic-link request.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your SplicR email"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.invite]
subject = "Your SplicR invitation code"
content_path = "./supabase/templates/invite-user.html"

[auth.email.template.magic_link]
subject = "Your SplicR sign-in code"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.email_change]
subject = "Confirm your new SplicR email"
content_path = "./supabase/templates/change-email.html"

[auth.email.template.recovery]
subject = "Your SplicR password reset code"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.reauthentication]
subject = "Verify your SplicR identity"
content_path = "./supabase/templates/reauthentication.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_splicr_before_user_created"

[auth.sms]
enable_signup = false
enable_confirmations = false
