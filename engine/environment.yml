# SplicR analysis environment.
#
# This specification reflects the tested local toolchain, not a solved lock.
#
#   python 3.11  Selected for this checkout. Verify package build constraints
#                when solving on another platform. MAGeCK2 is a separate newer
#                project and has not replaced or been validated against this
#                pipeline's MAGeCK 0.5.9.5 wrappers.
#
#   numpy <2     BAGEL2 calls np.in1d, removed in NumPy 2.0. With NumPy 2.x the
#                `bf` step dies with AttributeError after `fc` has already
#                written its output, so the failure looks like a BAGEL2 bug
#                rather than a dependency one.
#
# Recreate with:  bash engine/setup.sh
name: splicr
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11

  # Read handling
  - cutadapt=5.2          # anchored 5' trimming; handles staggered primers
  - fastp=1.3.7           # read QC, json output for the pipeline
  - seqkit=2.14.0         # stats and anchor location
  - samtools=1.24

  # Alignment. Exact-match counting is the default; bowtie is the fallback
  # for mismatch-tolerant mapping.
  - bowtie=1.3.1

  # Hit calling
  - mageck=0.5.9.5        # RRA and MLE; legacy version retained for reproducibility.

  # Scientific stack
  - numpy<2               # see note above
  - scipy
  - pandas
  - scikit-learn          # statistical/research utilities; no fitted calibration model
  - click                 # BAGEL2 dependency
  - pyarrow               # Parquet artifacts
  - polars
  - duckdb

# Installed separately by engine/setup.sh because they are not on bioconda:
#   BAGEL2  git clone https://github.com/hart-lab/bagel
#           Recorded local version: v2.0 build 115. setup.sh does not pin the
#           clone revision; record/pin the commit before a fresh reproduction.
