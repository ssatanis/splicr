# SplicR analysis environment.
#
# Pins matter here. Two of them are not optional:
#
#   python 3.11  MAGeCK's bioconda package pins python >=3.10,<3.11 in its own
#                metadata and will not solve against 3.12+. It is also the last
#                interpreter the 0.5.9.5 build (frozen since 2021) was made for.
#
#   numpy <2     BAGEL2 calls np.in1d, removed in NumPy 2.0. With NumPy 2.x the
#                `bf` step dies with AttributeError after `fc` has already
#                written its output, so the failure looks like a BAGEL2 bug
#                rather than a dependency one.
#
# Recreate with:  bash engine/setup.sh
name: splicr
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11

  # Read handling
  - cutadapt=5.2          # anchored 5' trimming; handles staggered primers
  - fastp=1.3.7           # read QC, json output for the pipeline
  - seqkit=2.14.0         # stats and anchor location
  - samtools=1.24

  # Alignment. Exact-match counting is the default; bowtie is the fallback
  # for mismatch-tolerant mapping.
  - bowtie=1.3.1

  # Hit calling
  - mageck=0.5.9.5        # RRA and MLE. Frozen upstream since Dec 2021.

  # Scientific stack
  - numpy<2               # see note above
  - scipy
  - pandas
  - scikit-learn          # calibration: isotonic and Platt
  - click                 # BAGEL2 dependency
  - pyarrow               # Parquet artifacts
  - polars
  - duckdb

# Installed separately by engine/setup.sh because they are not on bioconda:
#   BAGEL2  git clone https://github.com/hart-lab/bagel  (v2.0 build 115)
